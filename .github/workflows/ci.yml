name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config p/owasp-top-ten --config p/secrets --config p/typescript --error --quiet
